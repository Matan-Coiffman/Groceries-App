<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d8cdb3" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="קניות" />
    <title>רשימת קניות משפחתית</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@400;500;600;700;800&family=Suez+One&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #faf3e0;
        --paper-deep: #efe8d8;
        --desk: #d8cdb3;
        --ink: #2a241a;
      }
      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          linear-gradient(
            135deg,
            rgba(184, 85, 106, 0.18),
            rgba(90, 122, 72, 0.14)
          ),
          var(--desk);
        font-family: "Heebo", "Assistant", system-ui, sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      .app-shell {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: stretch;
        justify-content: center;
        overflow: hidden;
        padding: 0;
      }

      .phone-shell {
        width: min(100vw, 480px);
        height: 100%;
        min-height: 0;
        box-shadow: 0 28px 80px -40px rgba(42, 36, 26, 0.65);
      }

      .notebook-input::placeholder {
        color: rgba(42, 36, 26, 0.66);
      }

      :focus-visible {
        outline: 2px dashed #9c3f52;
        outline-offset: 2px;
      }

      .add-bar {
        box-shadow:
          0 4px 12px -6px rgba(0, 0, 0, 0.2),
          0 0 0 1px rgba(0, 0, 0, 0.04);
        transition:
          box-shadow 0.15s ease,
          transform 0.15s ease;
      }

      .add-bar:focus-within {
        box-shadow:
          0 10px 24px -12px rgba(42, 36, 26, 0.35),
          0 0 0 2px rgba(184, 85, 106, 0.35);
        transform: translateY(-1px);
      }

      .add-bar input:focus-visible {
        outline: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .hotspot,
      .hotspot-v,
      .hotspot-s {
        position: relative;
      }
      .hotspot::after,
      .hotspot-v::after,
      .hotspot-s::after {
        content: "";
        position: absolute;
      }
      .hotspot::after {
        inset: -10px;
      }
      .hotspot-v::after {
        inset: -9px 0;
      }
      .hotspot-s::after {
        inset: -6px;
      }

      @media (prefers-reduced-motion: reduce) {
        [style*="drawcheck"],
        [style*="scribbleStrike"],
        [style*="pageFlip"] {
          animation: none !important;
        }
      }

      .notebook-row:active {
        background: #f4ead1;
      }

      .paper-scroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(184, 85, 106, 0.35) transparent;
      }

      .paper-scroll::-webkit-scrollbar {
        width: 5px;
      }

      .paper-scroll::-webkit-scrollbar-thumb {
        background: rgba(184, 85, 106, 0.3);
        border-radius: 999px;
      }

      .paper-sheet::after {
        content: "";
        position: absolute;
        right: 0;
        left: 0;
        bottom: 0;
        height: 12px;
        pointer-events: none;
        z-index: 4;
        background: linear-gradient(180deg, rgba(250, 243, 224, 0), var(--paper));
      }

      @keyframes drawcheck {
        from {
          stroke-dashoffset: 24;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes pageFlip {
        from {
          opacity: 0;
          transform: translateY(8px) rotateX(-6deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes wobble {
        0%,
        100% {
          transform: rotate(-0.4deg);
        }
        50% {
          transform: rotate(0.4deg);
        }
      }

      @keyframes confettiFall {
        0% {
          transform: translateY(-30px) rotate(0);
          opacity: 1;
        }
        100% {
          transform: translateY(900px) rotate(720deg);
          opacity: 0;
        }
      }

      @keyframes scribbleStrike {
        from {
          stroke-dashoffset: 360;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      .row-del {
        opacity: 0.32;
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
      }
      .row-del:hover {
        opacity: 0.62;
      }
      .row-del:active {
        opacity: 0.9;
        transform: scale(0.88);
      }

      @media (min-width: 560px) {
        .app-shell {
          padding: 22px 0;
        }

        .phone-shell {
          border-radius: 30px;
          overflow: hidden;
          border: 1px solid rgba(255, 255, 255, 0.38);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin="anonymous"
      src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
      integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
    ></script>
    <script
      crossorigin="anonymous"
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
      integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
    ></script>
    <script src="./app.js" defer></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
