<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d8cdb3" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="קניות" />
    <title>רשימת קניות משפחתית</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@400;500;600;700;800&family=Suez+One&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          linear-gradient(
            135deg,
            rgba(184, 85, 106, 0.18),
            rgba(90, 122, 72, 0.14)
          ),
          #d8cdb3;
        font-family: "Heebo", "Assistant", system-ui, sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      .app-shell {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: stretch;
        justify-content: center;
        overflow: hidden;
        padding: 0;
      }

      .phone-shell {
        width: min(100vw, 480px);
        height: 100%;
        min-height: 0;
        box-shadow: 0 28px 80px -40px rgba(42, 36, 26, 0.65);
      }

      .notebook-input::placeholder {
        color: rgba(42, 36, 26, 0.4);
      }

      .notebook-row:active {
        background: #f4ead1;
      }

      .paper-scroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(184, 85, 106, 0.35) transparent;
      }

      .paper-scroll::-webkit-scrollbar {
        width: 5px;
      }

      .paper-scroll::-webkit-scrollbar-thumb {
        background: rgba(184, 85, 106, 0.3);
        border-radius: 999px;
      }

      .paper-sheet::after {
        content: "";
        position: absolute;
        right: 0;
        left: 0;
        bottom: 0;
        height: 12px;
        pointer-events: none;
        z-index: 4;
        background: linear-gradient(180deg, rgba(250, 243, 224, 0), #faf3e0);
      }

      @keyframes drawcheck {
        from {
          stroke-dashoffset: 24;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes pageFlip {
        from {
          opacity: 0;
          transform: translateY(8px) rotateX(-6deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes wobble {
        0%,
        100% {
          transform: rotate(-0.4deg);
        }
        50% {
          transform: rotate(0.4deg);
        }
      }

      @keyframes confettiFall {
        0% {
          transform: translateY(-30px) rotate(0);
          opacity: 1;
        }
        100% {
          transform: translateY(900px) rotate(720deg);
          opacity: 0;
        }
      }

      @keyframes scribbleStrike {
        from {
          stroke-dashoffset: 360;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      .row-del {
        opacity: 0.32;
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
      }
      .row-del:hover {
        opacity: 0.62;
      }
      .row-del:active {
        opacity: 0.9;
        transform: scale(0.88);
      }

      @media (min-width: 560px) {
        .app-shell {
          padding: 22px 0;
        }

        .phone-shell {
          border-radius: 30px;
          overflow: hidden;
          border: 1px solid rgba(255, 255, 255, 0.38);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script type="text/babel">
      const A_DEFAULTS = {
        accent: "#b8556a",
        density: "comfy",
        showAvatars: true,
        surprise: true,
      };

      const FAMILY = [
        { id: "avi", name: "מתן", initial: "מ", color: "#2c5a7a" },
        { id: "ima", name: "דביר", initial: "ד", color: "#b8556a" },
        { id: "noa", name: "נטע", initial: "נ", color: "#c89456" },
        { id: "yoa", name: "לירון", initial: "ל", color: "#5a7a48" },
        { id: "maya", name: "דויד", initial: "ד", color: "#7a5a8a" },
      ];

      const DEFAULT_SECTIONS = [
        { id: "sec_produce", name: "פירות וירקות" },
        { id: "sec_dairy", name: "מוצרי חלב" },
        { id: "sec_meat", name: "בשר ודגים" },
        { id: "sec_bakery", name: "מאפים" },
        { id: "sec_frozen", name: "קפואים" },
        { id: "sec_dry", name: "יבשים" },
        { id: "sec_clean", name: "ניקיון" },
      ];

      const DAY_MS = 24 * 60 * 60 * 1000;
      const LOCAL_CACHE_KEY = "family-groceries-cache-v1";

      function uid(prefix = "i") {
        return prefix + Math.random().toString(36).slice(2, 9);
      }

      function emptyState() {
        return {
          items: [],
          history: [],
          sections: DEFAULT_SECTIONS,
          version: 1,
        };
      }

      function daysAgoFor(entry, idx) {
        if (Number.isFinite(entry.ts))
          return Math.max(0, Math.round((Date.now() - entry.ts) / DAY_MS));
        if (Number.isFinite(entry.daysAgo)) return entry.daysAgo;
        return idx * 3;
      }

      function normalizeState(raw) {
        const fallback = emptyState();
        const safe = raw && typeof raw === "object" ? raw : fallback;
        const items = Array.isArray(safe.items) ? safe.items : fallback.items;
        const history = Array.isArray(safe.history)
          ? safe.history
          : fallback.history;
        const sections = Array.isArray(safe.sections)
          ? safe.sections
          : fallback.sections;
        return {
          items,
          history: history.map((entry, idx) => ({
            ...entry,
            daysAgo: daysAgoFor(entry, idx),
          })),
          sections,
          version: Number.isFinite(safe.version)
            ? safe.version
            : fallback.version,
        };
      }

      function readCachedState() {
        try {
          const raw = localStorage.getItem(LOCAL_CACHE_KEY);
          return raw ? normalizeState(JSON.parse(raw)) : null;
        } catch (error) {
          return null;
        }
      }

      function writeCachedState(state) {
        try {
          localStorage.setItem(
            LOCAL_CACHE_KEY,
            JSON.stringify(normalizeState(state)),
          );
        } catch (error) {}
      }

      function familyById(id) {
        return FAMILY.find((f) => f.id === id) || FAMILY[0];
      }

      function reasonFor(s) {
        if (s.count >= 3 && s.mostRecentDays <= 7) return "נקנה כמעט בכל שבוע";
        if (s.count >= 2 && s.mostRecentDays <= 7)
          return "נקנה לאחרונה — אולי נגמר?";
        if (s.count >= 2 && s.mostRecentDays > 7)
          return `נגמר לפני ${Math.round(s.mostRecentDays)} ימים`;
        if (s.count === 1 && s.mostRecentDays > 7)
          return "נקנה פעם, מומלץ לחדש";
        return "מומלץ לפי ההיסטוריה";
      }

      function deriveSuggestions(history, currentItems, max = 6) {
        const onList = new Set(currentItems.map((x) => x.text));
        const stats = new Map();

        history.forEach((h, idx) => {
          const daysAgo = daysAgoFor(h, idx);
          (h.items || []).forEach((it) => {
            const s = stats.get(it.text) || {
              count: 0,
              mostRecentDays: Infinity,
              lastBy: it.by,
            };
            s.count += 1;
            if (daysAgo < s.mostRecentDays) {
              s.mostRecentDays = daysAgo;
              s.lastBy = it.by;
            }
            stats.set(it.text, s);
          });
        });

        return [...stats.entries()]
          .filter(([text]) => !onList.has(text))
          .map(([text, s]) => ({
            text,
            ...s,
            score: s.count * 2 - Math.min(s.mostRecentDays, 14) / 7,
          }))
          .sort((a, b) => b.score - a.score)
          .slice(0, max)
          .map((s) => ({ text: s.text, reason: reasonFor(s), by: s.lastBy }));
      }

      function HoldButton({
        onComplete,
        children,
        color = "#222",
        dur = 1100,
      }) {
        const [pct, setPct] = React.useState(0);
        const raf = React.useRef(0);
        const start = React.useRef(0);
        const active = React.useRef(false);

        const tick = (t) => {
          if (!active.current) return;
          if (!start.current) start.current = t;
          const p = Math.min(1, (t - start.current) / dur);
          setPct(p);
          if (p >= 1) {
            active.current = false;
            setPct(0);
            start.current = 0;
            onComplete && onComplete();
            return;
          }
          raf.current = requestAnimationFrame(tick);
        };

        const begin = (e) => {
          e.preventDefault();
          active.current = true;
          start.current = 0;
          raf.current = requestAnimationFrame(tick);
        };

        const end = () => {
          active.current = false;
          start.current = 0;
          cancelAnimationFrame(raf.current);
          setPct(0);
        };

        return (
          <button
            type="button"
            onPointerDown={begin}
            onPointerUp={end}
            onPointerLeave={end}
            onPointerCancel={end}
            style={{
              position: "relative",
              overflow: "hidden",
              border: `1.5px dashed ${color}`,
              background: "transparent",
              color,
              fontSize: 14,
              fontWeight: 600,
              padding: "10px 18px",
              borderRadius: 14,
              cursor: "pointer",
              touchAction: "none",
              userSelect: "none",
              transition: "transform .12s",
              transform: pct > 0 ? "scale(.97)" : "scale(1)",
            }}
          >
            <div
              style={{
                position: "absolute",
                inset: 0,
                background: color,
                opacity: 0.14,
                transform: `translateX(${(1 - pct) * 100}%)`,
                transition: pct === 0 ? "transform .25s ease-out" : "none",
              }}
            />
            <span style={{ position: "relative", zIndex: 1 }}>{children}</span>
          </button>
        );
      }

      function HandCheckbox({ checked, color }) {
        return (
          <svg
            width="22"
            height="22"
            viewBox="0 0 22 22"
            style={{ flexShrink: 0 }}
          >
            <path
              d="M3.5 4 Q3 4.2 3 5 L3.2 17.5 Q3.4 18.2 4.2 18.2 L17.5 18 Q18.4 17.8 18.4 17 L18.2 4.6 Q18 3.8 17.2 3.8 Z"
              fill="none"
              stroke={color}
              strokeWidth="1.4"
              strokeLinejoin="round"
              strokeLinecap="round"
            />
            {checked && (
              <path
                d="M5.5 11.5 Q7 13 9.5 15.5 Q12 12 17 5.5"
                fill="none"
                stroke={color}
                strokeWidth="2.2"
                strokeLinecap="round"
                strokeLinejoin="round"
                style={{
                  strokeDasharray: 24,
                  strokeDashoffset: 0,
                  animation: "drawcheck .4s ease-out",
                }}
              />
            )}
          </svg>
        );
      }

      function Avatar({ id, size = 22, dark = false }) {
        const f = familyById(id);
        return (
          <div
            title={f.name}
            style={{
              width: size,
              height: size,
              borderRadius: "50%",
              background: dark ? f.color : `${f.color}22`,
              color: dark ? "#fff" : f.color,
              border: `1.2px solid ${f.color}`,
              display: "inline-flex",
              alignItems: "center",
              justifyContent: "center",
              fontFamily: '"Suez One", "Heebo"',
              fontSize: size * 0.5,
              fontWeight: 700,
              flexShrink: 0,
              lineHeight: 1,
            }}
          >
            {f.initial}
          </div>
        );
      }

      function Confetti({ fire }) {
        const pieces = React.useMemo(() => {
          if (!fire) return [];
          return Array.from({ length: 24 }).map((_, i) => ({
            left: Math.random() * 100,
            delay: Math.random() * 0.3,
            duration: 1.6 + Math.random() * 0.8,
            color: [
              "#b8556a",
              "#2c5a7a",
              "#5a7a48",
              "#c89456",
              "#7a5a8a",
              "#f7d774",
            ][i % 6],
            rot: Math.random() * 360,
            size: 6 + Math.random() * 6,
          }));
        }, [fire]);

        if (!fire) return null;
        return (
          <div
            style={{
              position: "absolute",
              inset: 0,
              pointerEvents: "none",
              overflow: "hidden",
              zIndex: 99,
            }}
          >
            {pieces.map((p, i) => (
              <div
                key={i}
                style={{
                  position: "absolute",
                  top: -20,
                  left: `${p.left}%`,
                  width: p.size,
                  height: p.size * 0.6,
                  background: p.color,
                  borderRadius: 1,
                  transform: `rotate(${p.rot}deg)`,
                  animation: `confettiFall ${p.duration}s ease-in ${p.delay}s forwards`,
                }}
              />
            ))}
          </div>
        );
      }

      function useGroceries() {
        const initial = React.useMemo(emptyState, []);
        const [items, setItems] = React.useState([]);
        const [history, setHistory] = React.useState([]);
        const [sections, setSections] = React.useState([]);
        const [version, setVersion] = React.useState(0);
        const [loading, setLoading] = React.useState(true);
        const [offline, setOffline] = React.useState(false);
        const [locked, setLocked] = React.useState(false);
        const [me, setMeState] = React.useState(() => {
          try {
            return localStorage.getItem("grocery-me");
          } catch (error) {
            return null;
          }
        });

        const stateRef = React.useRef(initial);
        const versionRef = React.useRef(0);
        const loadedRef = React.useRef(false);
        const lockedRef = React.useRef(false);
        const authRef = React.useRef("");
        const pendingRef = React.useRef(null);
        const postTimerRef = React.useRef(null);
        const saveSeqRef = React.useRef(0);
        const dirtyRef = React.useRef(false);
        const savingRef = React.useRef(false);
        const saveRetryDelayRef = React.useRef(2000);
        const pollTimerRef = React.useRef(null);
        const pollDelayRef = React.useRef(30000);

        React.useEffect(() => {
          try {
            authRef.current = localStorage.getItem("grocery-pw") || "";
          } catch (error) {
            authRef.current = "";
          }
        }, []);

        React.useEffect(() => {
          stateRef.current = { items, history, sections, version };
          versionRef.current = version;
        }, [items, history, sections, version]);

        React.useEffect(() => {
          lockedRef.current = locked;
        }, [locked]);

        const applyState = React.useCallback((next) => {
          const normalized = normalizeState(next);
          setItems(normalized.items);
          setHistory(normalized.history);
          setSections(normalized.sections);
          setVersion(normalized.version);
          stateRef.current = normalized;
          versionRef.current = normalized.version;
          loadedRef.current = true;
          writeCachedState(normalized);
        }, []);

        const apiFetch = React.useCallback(
          async (method = "GET", body, passwordOverride) => {
            const headers = { Accept: "application/json" };
            const password = passwordOverride ?? authRef.current;
            if (password) headers.Authorization = `Bearer ${password}`;
            const options = { method, headers };
            if (body) {
              headers["Content-Type"] = "application/json";
              options.body = JSON.stringify(body);
            }
            return fetch("/api/state", options);
          },
          [],
        );

        const fetchState = React.useCallback(
          async ({ silent = false, password } = {}) => {
            try {
              const res = await apiFetch("GET", null, password);
              if (res.status === 401) {
                setLocked(true);
                setLoading(false);
                setOffline(false);
                return false;
              }
              if (!res.ok) throw new Error(`GET /api/state ${res.status}`);
              const remote = await res.json();
              if (dirtyRef.current || pendingRef.current || savingRef.current) {
                setLocked(false);
                setOffline(false);
                setLoading(false);
                pollDelayRef.current = 30000;
                return true;
              }
              applyState(remote);
              setLocked(false);
              setOffline(false);
              setLoading(false);
              pollDelayRef.current = 30000;
              return true;
            } catch (error) {
              setOffline(true);
              setLoading(false);
              if (!loadedRef.current && !silent) {
                applyState(readCachedState() || initial);
              }
              return false;
            }
          },
          [apiFetch, applyState, initial],
        );

        const flushSave = React.useCallback(async () => {
          const pending = pendingRef.current;
          if (!pending || savingRef.current) return;

          savingRef.current = true;
          const seq = ++saveSeqRef.current;
          const body = {
            items: pending.items,
            history: pending.history,
            sections: pending.sections,
            baseVersion: pending.baseVersion,
          };

          try {
            const res = await apiFetch("POST", body);
            if (res.status === 401) {
              setLocked(true);
              setOffline(false);
              return;
            }
            if (res.status === 409) {
              const latest = await res.json();
              if (pendingRef.current === pending) {
                pendingRef.current = null;
                dirtyRef.current = false;
                saveRetryDelayRef.current = 2000;
                applyState(latest);
              } else if (pendingRef.current) {
                pendingRef.current = {
                  ...pendingRef.current,
                  baseVersion: latest.version,
                };
                if (postTimerRef.current) clearTimeout(postTimerRef.current);
                postTimerRef.current = setTimeout(flushSave, 250);
              }
              setOffline(false);
              return;
            }
            if (!res.ok) throw new Error(`POST /api/state ${res.status}`);
            const ack = await res.json();
            if (Number.isFinite(ack.version)) {
              if (seq === saveSeqRef.current) {
                setVersion(ack.version);
                versionRef.current = ack.version;
                stateRef.current = {
                  ...stateRef.current,
                  version: ack.version,
                };
                writeCachedState(stateRef.current);
              }
              if (pendingRef.current === pending) {
                pendingRef.current = null;
                dirtyRef.current = false;
                saveRetryDelayRef.current = 2000;
              } else if (pendingRef.current) {
                pendingRef.current = {
                  ...pendingRef.current,
                  baseVersion: ack.version,
                };
                if (postTimerRef.current) clearTimeout(postTimerRef.current);
                postTimerRef.current = setTimeout(flushSave, 250);
              }
            }
            setOffline(false);
          } catch (error) {
            setOffline(true);
            if (pendingRef.current) {
              if (postTimerRef.current) clearTimeout(postTimerRef.current);
              postTimerRef.current = setTimeout(
                flushSave,
                saveRetryDelayRef.current,
              );
              saveRetryDelayRef.current = Math.min(
                30000,
                saveRetryDelayRef.current * 2,
              );
            }
          } finally {
            savingRef.current = false;
          }
        }, [apiFetch, applyState]);

        const scheduleSave = React.useCallback(
          (nextState) => {
            pendingRef.current = {
              items: nextState.items,
              history: nextState.history,
              sections: nextState.sections,
              baseVersion: versionRef.current,
            };
            if (postTimerRef.current) clearTimeout(postTimerRef.current);
            postTimerRef.current = setTimeout(flushSave, 250);
          },
          [flushSave],
        );

        const mutate = React.useCallback(
          (producer) => {
            const prev = stateRef.current;
            const next = { ...prev, ...producer(prev) };
            setItems(next.items);
            setHistory(next.history);
            setSections(next.sections);
            stateRef.current = next;
            dirtyRef.current = true;
            writeCachedState(next);
            scheduleSave(next);
          },
          [scheduleSave],
        );

        React.useEffect(() => {
          fetchState();

          const schedulePoll = (delay = pollDelayRef.current) => {
            if (pollTimerRef.current) clearTimeout(pollTimerRef.current);
            pollTimerRef.current = setTimeout(async () => {
              if (
                !lockedRef.current &&
                document.visibilityState === "visible"
              ) {
                const ok = await fetchState({ silent: true });
                pollDelayRef.current = ok
                  ? 30000
                  : Math.min(300000, pollDelayRef.current * 2);
              }
              schedulePoll(pollDelayRef.current);
            }, delay);
          };

          const refetchNow = () => {
            if (!lockedRef.current) {
              pollDelayRef.current = 30000;
              fetchState({ silent: true });
            }
          };

          const onVisibility = () => {
            if (document.visibilityState === "visible") refetchNow();
          };

          const onOnline = () => refetchNow();

          window.addEventListener("focus", refetchNow);
          window.addEventListener("online", onOnline);
          document.addEventListener("visibilitychange", onVisibility);
          schedulePoll(30000);

          return () => {
            if (postTimerRef.current) clearTimeout(postTimerRef.current);
            if (pollTimerRef.current) clearTimeout(pollTimerRef.current);
            window.removeEventListener("focus", refetchNow);
            window.removeEventListener("online", onOnline);
            document.removeEventListener("visibilitychange", onVisibility);
          };
        }, [fetchState]);

        const setMe = React.useCallback((id) => {
          setMeState(id);
          try {
            localStorage.setItem("grocery-me", id);
          } catch (error) {}
        }, []);

        const unlock = React.useCallback(
          async (password) => {
            const trimmed = password.trim();
            authRef.current = trimmed;
            const ok = await fetchState({ password: trimmed });
            if (ok) {
              try {
                localStorage.setItem("grocery-pw", trimmed);
              } catch (error) {}
              if (pendingRef.current) {
                if (postTimerRef.current) clearTimeout(postTimerRef.current);
                postTimerRef.current = setTimeout(flushSave, 250);
              }
            }
            return ok;
          },
          [fetchState, flushSave],
        );

        const add = React.useCallback(
          (text, qty = 1, by = me || "ima", section = null) => {
            const clean = text.trim();
            if (!clean) return;
            const key = clean.toLowerCase();
            mutate((prev) => {
              const idx = prev.items.findIndex(
                (x) => x.text.trim().toLowerCase() === key,
              );
              if (idx !== -1) {
                const ex = prev.items[idx];
                const merged = {
                  ...ex,
                  qty: ex.qty + qty,
                  done: false,
                  ts: Date.now(),
                };
                return {
                  items: [merged, ...prev.items.filter((_, i) => i !== idx)],
                  history: prev.history,
                };
              }
              return {
                items: [
                  {
                    id: uid(),
                    text: clean,
                    qty,
                    by,
                    section,
                    done: false,
                    pinned: false,
                    ts: Date.now(),
                  },
                  ...prev.items,
                ],
                history: prev.history,
              };
            });
          },
          [me, mutate],
        );

        const remove = React.useCallback(
          (id) => {
            mutate((prev) => ({
              items: prev.items.filter((x) => x.id !== id),
              history: prev.history,
            }));
          },
          [mutate],
        );

        const toggle = React.useCallback(
          (id) => {
            mutate((prev) => ({
              items: prev.items.map((x) =>
                x.id === id ? { ...x, done: !x.done } : x,
              ),
              history: prev.history,
            }));
          },
          [mutate],
        );

        const togglePin = React.useCallback(
          (id) => {
            mutate((prev) => ({
              items: prev.items.map((x) =>
                x.id === id ? { ...x, pinned: !x.pinned } : x,
              ),
              history: prev.history,
            }));
          },
          [mutate],
        );

        const setQty = React.useCallback(
          (id, qty) => {
            mutate((prev) => ({
              items: prev.items.map((x) =>
                x.id === id ? { ...x, qty: Math.max(1, qty) } : x,
              ),
              history: prev.history,
            }));
          },
          [mutate],
        );

        const setItemSection = React.useCallback(
          (id, section) => {
            mutate((prev) => ({
              items: prev.items.map((x) =>
                x.id === id ? { ...x, section: section || null } : x,
              ),
              history: prev.history,
            }));
          },
          [mutate],
        );

        const addSection = React.useCallback(
          (name) => {
            const clean = (name || "").trim();
            if (!clean) return null;
            const id = uid("sec");
            mutate((prev) => ({
              sections: [...prev.sections, { id, name: clean }],
            }));
            return id;
          },
          [mutate],
        );

        const renameSection = React.useCallback(
          (id, name) => {
            const clean = (name || "").trim();
            if (!clean) return;
            mutate((prev) => ({
              sections: prev.sections.map((s) =>
                s.id === id ? { ...s, name: clean } : s,
              ),
            }));
          },
          [mutate],
        );

        const removeSection = React.useCallback(
          (id) => {
            mutate((prev) => ({
              sections: prev.sections.filter((s) => s.id !== id),
              items: prev.items.map((x) =>
                x.section === id ? { ...x, section: null } : x,
              ),
            }));
          },
          [mutate],
        );

        const reorderSections = React.useCallback(
          (from, to) => {
            mutate((prev) => {
              if (
                from < 0 ||
                to < 0 ||
                from >= prev.sections.length ||
                to >= prev.sections.length
              )
                return {};
              const next = [...prev.sections];
              const [moved] = next.splice(from, 1);
              next.splice(to, 0, moved);
              return { sections: next };
            });
          },
          [mutate],
        );

        const reorder = React.useCallback(
          (fromIdx, toIdx) => {
            mutate((prev) => {
              if (
                toIdx < 0 ||
                toIdx >= prev.items.length ||
                fromIdx === toIdx
              ) {
                return { items: prev.items, history: prev.history };
              }
              const nextItems = prev.items.slice();
              const [it] = nextItems.splice(fromIdx, 1);
              nextItems.splice(toIdx, 0, it);
              return { items: nextItems, history: prev.history };
            });
          },
          [mutate],
        );

        const reset = React.useCallback(
          () => {
            const current = stateRef.current.items;
            if (!current.length) return;
            mutate((prev) => ({
              items: prev.items
                .filter((x) => x.pinned)
                .map((x) => ({ ...x, done: false })),
            }));
          },
          [mutate],
        );

        const restoreFromHistory = React.useCallback(
          (histId) => {
            const h = stateRef.current.history.find((x) => x.id === histId);
            if (!h) return;
            mutate((prev) => {
              const existing = new Set(prev.items.map((x) => x.text));
              const adds = (h.items || [])
                .filter((x) => !existing.has(x.text))
                .map((x) => ({
                  id: uid(),
                  text: x.text,
                  qty: x.qty || 1,
                  by: x.by || me || "ima",
                  done: false,
                  pinned: false,
                  ts: Date.now(),
                }));
              return { items: [...adds, ...prev.items], history: prev.history };
            });
          },
          [me, mutate],
        );

        const addSuggestion = React.useCallback(
          (text) => add(text, 1, me || "ima"),
          [add, me],
        );

        return {
          items,
          history,
          sections,
          version,
          loading,
          offline,
          locked,
          me,
          setMe,
          unlock,
          add,
          remove,
          toggle,
          togglePin,
          setQty,
          setItemSection,
          addSection,
          renameSection,
          removeSection,
          reorderSections,
          reorder,
          reset,
          restoreFromHistory,
          addSuggestion,
        };
      }

                  fontWeight: 400,
                  color: accent,
                  cursor: disabled ? "default" : "text",
                  padding: 0,
                  whiteSpace: "nowrap",
                  overflow: "hidden",
                  textOverflow: "ellipsis",
                }}
              >
                {section.name}
              </button>
            )}
            <span style={countStyle}>{count}</span>
            {!disabled && !editing && (
              <React.Fragment>
                {confirmDel ? (
                  <button
                    type="button"
                    onClick={() => g.removeSection(section.id)}
                    style={{
                      border: "none",
                      background: accent,
                      color: "#fff",
                      borderRadius: 999,
                      padding: "2px 8px",
                      fontSize: 10,
                      fontWeight: 700,
                      cursor: "pointer",
                      flexShrink: 0,
                    }}
                  >
                    מחק?
                  </button>
                ) : (
                  <button
                    type="button"
                    onClick={() => {
                      setConfirmDel(true);
                      delTimerRef.current = setTimeout(
                        () => setConfirmDel(false),
                        3000,
                      );
                    }}
                    aria-label="מחק מחלקה"
                    title="מחק מחלקה"
                    style={iconBtn(true)}
                  >
                    ✕
                  </button>
                )}
              </React.Fragment>
            )}
          </div>
        );
      }

      function NotebookApp({ tweaks = A_DEFAULTS }) {
        const g = useGroceries();
        const [draft, setDraft] = React.useState("");
        const [draftQty, setDraftQty] = React.useState(1);
        const [draggingSection, setDraggingSection] = React.useState(null);
        const [activeSection, setActiveSection] = React.useState(null);
        const [creatingSection, setCreatingSection] = React.useState(false);
        const [newSectionName, setNewSectionName] = React.useState("");

        const accent = tweaks.accent || A_DEFAULTS.accent;
        const rowH = tweaks.density === "compact" ? 36 : 44;
        const allDone = g.items.length > 0 && g.items.every((x) => x.done);
        const showConfetti = tweaks.surprise !== false && allDone;

        const pinned = g.items.filter((x) => x.pinned);
        const regular = g.items.filter((x) => !x.pinned);
        const orderedItems = [...pinned, ...regular];
        const q = draft.trim().toLowerCase();
        const visibleItems = q
          ? orderedItems.filter((x) => x.text.toLowerCase().includes(q))
          : orderedItems;
        const groups = React.useMemo(() => {
          const ids = new Set(g.sections.map((s) => s.id));
          const bySec = {};
          const uncategorized = [];
          visibleItems.forEach((it) => {
            if (it.section && ids.has(it.section)) {
              (bySec[it.section] = bySec[it.section] || []).push(it);
            } else {
              uncategorized.push(it);
            }
          });
          return { bySec, uncategorized };
        }, [visibleItems, g.sections]);

        const onSectionDragStart = (index, e) => {
          if (q) return;
          e.preventDefault();
          e.stopPropagation();
          const sec = g.sections[index];
          setDraggingSection(sec ? sec.id : null);
          let lastIdx = index;

          const move = (ev) => {
            const headers = [
              ...document.querySelectorAll("[data-sec-index]"),
            ].map((h) => {
              const r = h.getBoundingClientRect();
              return {
                idx: Number(h.dataset.secIndex),
                mid: r.top + r.height / 2,
              };
            });
            if (!headers.length) return;
            let best = lastIdx;
            let bestDist = Infinity;
            for (const h of headers) {
              const d = Math.abs(h.mid - ev.clientY);
              if (d < bestDist) {
                bestDist = d;
                best = h.idx;
              }
            }
            if (best !== lastIdx) {
              g.reorderSections(lastIdx, best);
              lastIdx = best;
            }
          };

          const up = () => {
            setDraggingSection(null);
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };

          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        };

        const onAdd = () => {
          if (!draft.trim()) return;
          g.add(draft, draftQty, g.me || "ima", activeSection);
          setDraft("");
          setDraftQty(1);
        };

        const createSection = () => {
          const t = newSectionName.trim();
          setCreatingSection(false);
          setNewSectionName("");
          if (!t) return;
          const existing = g.sections.find(
            (s) => s.name.trim().toLowerCase() === t.toLowerCase(),
          );
          if (existing) {
            setActiveSection(existing.id);
            return;
          }
          const id = g.addSection(t);
          if (id) setActiveSection(id);
        };

        const paperBackground = `
            linear-gradient(180deg, transparent 0%, transparent 32px, #d6c89c 32px, #d6c89c 33px, transparent 33px),
            repeating-linear-gradient(0deg, transparent 0, transparent 1px, rgba(120,160,200,.36) 1px, rgba(120,160,200,.36) 2px, transparent 2px, transparent ${rowH}px)
          `;

        if (g.loading) {
          return (
            <div
              dir="rtl"
              style={{
                height: "100%",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                background: "#efe8d8",
                color: "#2a241a",
                fontSize: 18,
                fontWeight: 700,
              }}
            >
              טוען…
            </div>
          );
        }

        return (
          <div
            dir="rtl"
            style={{
              height: "100%",
              minHeight: 0,
              display: "flex",
              flexDirection: "column",
              background: "#efe8d8",
              color: "#2a241a",
              position: "relative",
              overflow: "hidden",
            }}
          >
            <Confetti fire={showConfetti} />

            <div
              style={{
                height: "calc(36px + env(safe-area-inset-top))",
                flexShrink: 0,
                background: "#d8cdb3",
              }}
            />

            <div
              style={{
                height: 38,
                background: "#d8cdb3",
                borderBottom: "1px solid #b4a583",
                display: "flex",
                alignItems: "flex-end",
                justifyContent: "space-around",
                padding: "0 14px 4px",
                position: "relative",
                zIndex: 5,
                boxShadow: "0 4px 8px -4px rgba(0,0,0,.18) inset",
              }}
            >
              {Array.from({ length: 14 }).map((_, i) => (
                <div
                  key={i}
                  style={{
                    width: 10,
                    height: 22,
                    background: "#8a7a5a",
                    borderRadius: 5,
                    boxShadow:
                      "inset 0 -3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.4)",
                  }}
                />
              ))}
            </div>

            <div
              style={{
                padding: "12px 22px 6px",
                display: "flex",
                alignItems: "baseline",
                justifyContent: "space-between",
                gap: 12,
              }}
            >
              <div>
                <div
                  style={{
                    fontFamily: '"Suez One", "Heebo"',
                    fontSize: 26,
                    fontWeight: 400,
                    lineHeight: 1.05,
                    letterSpacing: 0,
                  }}
                >
                  רשימת קניות
                </div>
                <div
                  style={{
                    fontSize: 12,
                    opacity: 0.55,
                    marginTop: 2,
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                  }}
                >
                  <span>המשפחה · {g.items.length} פריטים</span>
                  {g.offline && (
                    <span
                      style={{
                        color: "#a52a1f",
                        background: "#f5d8d4",
                        borderRadius: 6,
                        padding: "1px 6px",
                        fontWeight: 700,
                      }}
                    >
                      לא מחובר
                    </span>
                  )}
                </div>
              </div>

              <div style={{ display: "flex", flexDirection: "row-reverse" }}>
                {FAMILY.map((f, i) => (
                  <button
                    type="button"
                    key={f.id}
                    onClick={() => g.setMe(f.id)}
                    style={{
                      marginInlineStart: i === 0 ? 0 : -6,
                      cursor: "pointer",
                      outline: g.me === f.id ? `2px solid ${accent}` : "none",
                      borderRadius: "50%",
                      transition: "transform .15s",
                      transform: g.me === f.id ? "translateY(-2px)" : "none",
                      border: "none",
                      background: "transparent",
                      padding: 0,
                    }}
                    aria-label={`בחר ${f.name}`}
                  >
                    <Avatar id={f.id} size={26} dark />
                  </button>
                ))}
              </div>
            </div>

            <div
              className="paper-sheet"
              style={{
                flex: 1,
                minHeight: 0,
                background: "#faf3e0",
                margin: "2px 14px calc(10px + env(safe-area-inset-bottom))",
                borderRadius: "16px 16px 18px 18px",
                boxShadow:
                  "0 1px 0 #fff inset, 0 8px 16px -10px rgba(0,0,0,.2)",
                position: "relative",
                overflow: "hidden",
              }}
            >
              <div
                style={{
                  position: "absolute",
                  top: 0,
                  bottom: 0,
                  right: 32,
                  width: 1.5,
                  background: `linear-gradient(180deg, transparent 0, ${accent} 18px, ${accent} 100%)`,
                  opacity: 0.5,
                  zIndex: 2,
                  pointerEvents: "none",
                }}
              />

              <div
                className="paper-scroll"
                style={{
                  height: "100%",
                  overflowY: "auto",
                  WebkitOverflowScrolling: "touch",
                  backgroundImage: paperBackground,
                  backgroundPosition: `0 0, 0 ${8 + Math.round(rowH * 0.72)}px`,
                }}
              >
                <div key="list">
                    <div
                      style={{
                        position: "sticky",
                        top: 0,
                        zIndex: 3,
                        background: "#faf3e0",
                        padding: "16px 44px 10px 16px",
                      }}
                    >
                      <div
                        style={{
                          display: "flex",
                          gap: 6,
                          overflowX: "auto",
                          marginBottom: 8,
                          paddingBottom: 2,
                        }}
                      >
                        <button
                          type="button"
                          onClick={() => setActiveSection(null)}
                          style={{
                            flexShrink: 0,
                            border:
                              activeSection === null
                                ? `1.5px solid ${accent}`
                                : "1px solid #d8cdb3",
                            background: activeSection === null ? accent : "#fff",
                            color: activeSection === null ? "#fff" : "#2a241a",
                            borderRadius: 999,
                            padding: "4px 11px",
                            fontSize: 12,
                            fontWeight: activeSection === null ? 700 : 500,
                            cursor: "pointer",
                            whiteSpace: "nowrap",
                          }}
                        >
                          ללא מחלקה
                        </button>
                        {g.sections.map((s) => (
                          <button
                            type="button"
                            key={s.id}
                            onClick={() => setActiveSection(s.id)}
                            style={{
                              flexShrink: 0,
                              border:
                                activeSection === s.id
                                  ? `1.5px solid ${accent}`
                                  : "1px solid #d8cdb3",
                              background: activeSection === s.id ? accent : "#fff",
                              color: activeSection === s.id ? "#fff" : "#2a241a",
                              borderRadius: 999,
                              padding: "4px 11px",
                              fontSize: 12,
                              fontWeight: activeSection === s.id ? 700 : 500,
                              cursor: "pointer",
                              whiteSpace: "nowrap",
                            }}
                          >
                            {s.name}
                          </button>
                        ))}
                        {creatingSection ? (
                          <input
                            autoFocus
                            value={newSectionName}
                            onChange={(e) => setNewSectionName(e.target.value)}
                            onBlur={createSection}
                            onKeyDown={(e) => {
                              if (e.key === "Enter") createSection();
                              if (e.key === "Escape") {
                                setCreatingSection(false);
                                setNewSectionName("");
                              }
                            }}
                            placeholder="שם מחלקה…"
                            dir="rtl"
                            style={{
                              flexShrink: 0,
                              width: 110,
                              border: `1.5px solid ${accent}`,
                              borderRadius: 999,
                              padding: "4px 11px",
                              fontSize: 12,
                              outline: "none",
                              background: "#fff",
                            }}
                          />
                        ) : (
                          <button
                            type="button"
                            onClick={() => setCreatingSection(true)}
                            style={{
                              flexShrink: 0,
                              border: `1px dashed ${accent}`,
                              background: "transparent",
                              color: accent,
                              borderRadius: 999,
                              padding: "4px 11px",
                              fontSize: 12,
                              fontWeight: 700,
                              cursor: "pointer",
                              whiteSpace: "nowrap",
                            }}
                          >
                            + מחלקה
                          </button>
                        )}
                      </div>
                      <div
                        style={{
                          display: "flex",
                          alignItems: "center",
                          gap: 8,
                          background: "#fff",
                          borderRadius: 14,
                          padding: "6px 10px",
                          boxShadow:
                            "0 4px 12px -6px rgba(0,0,0,.2), 0 0 0 1px rgba(0,0,0,.04)",
                        }}
                      >
                        <Avatar id={g.me || "ima"} size={26} dark />
                        <input
                          className="notebook-input"
                          value={draft}
                          onChange={(e) => setDraft(e.target.value)}
                          onKeyDown={(e) => e.key === "Enter" && onAdd()}
                          placeholder="הוסף או חפש…"
                          dir="rtl"
                          style={{
                            flex: 1,
                            minWidth: 0,
                            border: "none",
                            outline: "none",
                            background: "transparent",
                            fontSize: 15,
                            padding: "6px 0",
                          }}
                        />
                        {draft && (
                          <div
                            style={{
                              display: "flex",
                              alignItems: "center",
                              gap: 4,
                            }}
                          >
                            <button
                              type="button"
                              onClick={() =>
                                setDraftQty(Math.max(1, draftQty - 1))
                              }
                              style={{
                                background: "#efe8d8",
                                border: "none",
                                width: 22,
                                height: 22,
                                borderRadius: "50%",
                                cursor: "pointer",
                                fontSize: 14,
                                fontWeight: 700,
                              }}
                            >
                              −
                            </button>
                            <span
                              style={{
                                minWidth: 18,
                                textAlign: "center",
                                fontFamily: "monospace",
                                fontSize: 14,
                              }}
                            >
                              {draftQty}
                            </span>
                            <button
                              type="button"
                              onClick={() => setDraftQty(draftQty + 1)}
                              style={{
                                background: "#efe8d8",
                                border: "none",
                                width: 22,
                                height: 22,
                                borderRadius: "50%",
                                cursor: "pointer",
                                fontSize: 14,
                                fontWeight: 700,
                              }}
                            >
                              +
                            </button>
                          </div>
                        )}
                        {draft && (
                          <button
                            type="button"
                            onClick={() => setDraft("")}
                            aria-label="נקה"
                            style={{
                              border: "none",
                              background: "#efe8d8",
                              width: 24,
                              height: 24,
                              borderRadius: "50%",
                              cursor: "pointer",
                              fontWeight: 700,
                              color: "#2a241a",
                              lineHeight: 1,
                              flexShrink: 0,
                            }}
                          >
                            ✕
                          </button>
                        )}
                        <button
                          type="button"
                          onClick={onAdd}
                          disabled={!draft.trim()}
                          style={{
                            background: draft.trim() ? accent : "#d4cab3",
                            color: "#fff",
                            border: "none",
                            borderRadius: 10,
                            padding: "8px 14px",
                            fontSize: 14,
                            fontWeight: 700,
                            cursor: draft.trim() ? "pointer" : "default",
                            transition: "background .15s",
                            flexShrink: 0,
                          }}
                        >
                          הוסף
                        </button>
                      </div>
                    </div>

                    <div
                      style={{
                        animation: "pageFlip .25s ease-out",
                        padding: "2px 44px 96px 16px",
                      }}
                    >

                    {g.items.length === 0 && (
                      <div
                        style={{
                          textAlign: "center",
                          opacity: 0.4,
                          marginTop: 60,
                          fontStyle: "italic",
                        }}
                      >
                        הרשימה ריקה. תוסיף משהו?
                      </div>
                    )}

                    {g.items.length > 0 && visibleItems.length === 0 && (
                      <div
                        style={{
                          textAlign: "center",
                          opacity: 0.48,
                          marginTop: 46,
                          fontStyle: "italic",
                        }}
                      >
                        אין "{draft}" ברשימה — Enter להוספה
                      </div>
                    )}

                    {groups.uncategorized.length > 0 && (
                      <React.Fragment>
                        <SectionHeader
                          uncategorized
                          count={groups.uncategorized.length}
                          accent={accent}
                        />
                        {groups.uncategorized.map((it) => (
                          <ItemRow
                            key={it.id}
                            it={it}
                            rowH={rowH}
                            accent={accent}
                            g={g}
                            showAvatars={tweaks.showAvatars}
                          />
                        ))}
                      </React.Fragment>
                    )}
                    {g.sections.map((s, idx) => {
                      const its = groups.bySec[s.id] || [];
                      if (q && its.length === 0) return null;
                      return (
                        <React.Fragment key={s.id}>
                          <SectionHeader
                            section={s}
                            index={idx}
                            total={g.sections.length}
                            count={its.length}
                            accent={accent}
                            g={g}
                            disabled={Boolean(q)}
                            onDragStart={onSectionDragStart}
                            dragging={draggingSection === s.id}
                          />
                          {its.map((it) => (
                            <ItemRow
                              key={it.id}
                              it={it}
                              rowH={rowH}
                              accent={accent}
                              g={g}
                              showAvatars={tweaks.showAvatars}
                            />
                          ))}
                        </React.Fragment>
                      );
                    })}
                    </div>
                  </div>
              </div>
              <div
                style={{
                  position: "absolute",
                  left: 0,
                  right: 0,
                  bottom: 0,
                  zIndex: 5,
                  display: "flex",
                  justifyContent: "center",
                  padding: "12px 16px 14px",
                  background:
                    "linear-gradient(180deg, rgba(250,243,224,0), #faf3e0 38%)",
                  pointerEvents: "none",
                }}
              >
                <div style={{ pointerEvents: "auto" }}>
                  <HoldButton
                    color={accent}
                    onComplete={() => g.reset("רשימת קניות")}
                  >
                    ✂ לחצו להתחלת רשימה חדשה
                  </HoldButton>
                </div>
              </div>
            </div>

            {g.locked && <LockScreen onUnlock={g.unlock} accent={accent} />}
            {!g.locked && g.me === null && (
              <IdentityPicker onPick={g.setMe} accent={accent} />
            )}
          </div>
        );
      }

      function App() {
        return (
          <div className="app-shell">
            <div className="phone-shell">
              <NotebookApp />
            </div>
          </div>
        );
      }

      Object.assign(window, {
        useGroceries,
        FAMILY,
        familyById,
        deriveSuggestions,
        Confetti,
        NotebookApp,
        A_DEFAULTS,
        HoldButton,
        Avatar,
      });

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
